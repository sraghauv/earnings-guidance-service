[project]
name = "earnings-guidance-service"
version = "0.1.0"
description = "Extracts forward guidance from earnings call transcripts and runs a peer-multiple valuation off it."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "pyarrow>=17.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# E501 is handled by review, not the linter -- a few long lines read better
# than the wrapping needed to avoid them.
# RUF001: curly apostrophes are data here, not typos. normalize.py straightens
# them deliberately and a test asserts that behaviour, so the literal U+2019
# has to stay exactly where it is.
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# Depends() and Query() in argument defaults is how FastAPI declares
# dependencies; B008 is a false positive on every route.
"src/egs/api/*.py" = ["B008"]
